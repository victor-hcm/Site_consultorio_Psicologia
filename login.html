<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Espaço MeD + Vida</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="\Users\victor.moreira\Downloads\consultorio-psicologia/css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center vh-100 bg-light">
    <div class="card shadow p-4 border-0" style="width: 100%; max-width: 400px;">
        <div class="text-center mb-4">
            <i class="fa-solid fa-lock text-primary display-4"></i>
            <h3 class="text-primary mt-2">Área Restrita</h3>
            <p class="small text-muted">Acesse sua conta ou painel administrativo</p>
        </div>
        <form action="admin.html" method="GET">
            <div class="mb-3">
                <label class="form-label">E-mail</label>
                <input type="email" class="form-control" required placeholder="admin@espacomedvida.com">
            </div>
            <div class="mb-3">
                <label class="form-label">Senha</label>
                <input type="password" class="form-control" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">Entrar</button>
        </form>
        <div class="text-center mt-3">
            <a href="index.html" class="small text-decoration-none">Voltar para o site principal</a>
        </div>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
